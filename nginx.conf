worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # --- SECURITY: hide nginx version ---
    server_tokens off;

    # --- PERFORMANCE ---
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    # --- GZIP COMPRESSION (reduces file size ~70%) ---
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/html
        text/css
        text/plain
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # --- SECURITY HEADERS ---
        # add_header en un location anula los del server: el include se repite
        # en cada location con add_header propio para que SIEMPRE se envíen.
        include /etc/nginx/security-headers.conf;

        # --- CACHE: HTML (short cache, always fresh) ---
        location = /index.html {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-cache, must-revalidate";
            try_files $uri =404;
        }

        # --- CACHE: SEO files ---
        location = /robots.txt {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "public, max-age=86400";
            try_files $uri =404;
        }
        location = /sitemap.xml {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "public, max-age=86400";
            try_files $uri =404;
        }

        # --- FAVICON redirect (favicon.ico no existe como archivo, usa logo.png) ---
        location = /favicon.ico {
            return 301 /logo.png;
        }

        # --- CACHE: Images (30 days) ---
        location ~* \.(jpg|jpeg|png|gif|ico|svg|webp)$ {
            include /etc/nginx/security-headers.conf;
            expires 30d;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # --- CACHE: Fonts (1 year) ---
        location ~* \.(woff|woff2|ttf|otf|eot)$ {
            include /etc/nginx/security-headers.conf;
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # --- SPA fallback ---
        location / {
            try_files $uri $uri/ /index.html;
        }

        # --- Block hidden files ---
        location ~ /\. {
            deny all;
            return 404;
        }
    }
}
